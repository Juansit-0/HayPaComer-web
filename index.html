<body>
  <div class="loader" data-loader aria-hidden="true">
    <div class="loader-word"><span>HayPaComer</span><span class="loader-fill">HayPaComer</span></div>

  <a class="skip" href="#main" data-i18n="nav.skip">Skip to content</a>
  <div class="shell">
    <aside class="stage" data-stage-box hidden>
      <div class="stage-fridge" data-stage></div>
      <nav class="tabs" data-i18n-label="nav.sections" hidden>
        <a href="#/now" data-tab="now" data-i18n="nav.now">Now</a>
        <a href="#/fridge" data-tab="fridge" data-i18n="nav.fridge">Fridge</a>
        <a href="#/market" data-tab="market" data-i18n="nav.market">Market</a>

        <a href="#/chef" data-tab="chef" data-i18n="nav.chef">Chef</a>
      </nav>
    </aside>
    <div class="column">
      <header class="bar">
        <a class="brand" href="#/now" data-i18n-label="nav.home">
          <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="12" y="10" width="8" height="44" rx="3" fill="currentColor"/>
            <rect x="44" y="10" width="8" height="44" rx="3" fill="currentColor"/>
            <path d="M8 32 H56" stroke="var(--color-primary)" stroke-width="6" stroke-linecap="round"/>

        </div>
        <label class="language"><span class="visually-hidden" data-i18n="nav.language">Language</span><select data-language></select></label>
      </header>
      <p class="notice" role="status" data-degraded hidden></p>
      <main id="main" tabindex="-1" aria-busy="true"></main>
    </div>
  </div>
  <div class="toast" role="status" aria-live="polite" data-toast></div>
  <span id="hold-hint" hidden data-i18n="hold.hint">Press and hold to confirm</span>
